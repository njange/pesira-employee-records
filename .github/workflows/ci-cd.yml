name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or pull request cancels the older run's checks.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # Testcontainers starts PostgreSQL in the runner's Docker.
      - run: ./mvnw -B test

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # Vercel deploys the frontend through its GitHub integration; this job deploys the API.
  deploy:
    name: Deploy API to the VPS
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Deploys run one at a time and are never cancelled halfway.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      VPS_HOST: 169.58.177.148
      VPS_HOST_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINdZrI7NaL/Nv78cxGSh0FFI+vskepajhoi3eippRXA9
      API_URL: https://pesira-api.169.58.177.148.nip.io
    steps:
      - name: Run the deploy script on the VPS
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "$VPS_HOST $VPS_HOST_KEY" > ~/.ssh/known_hosts
          # The key's forced command runs deploy/deploy.sh; nothing else is allowed.
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "root@$VPS_HOST"

      - name: Check the live API
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' "$API_URL/api/auth/me")
          echo "GET /api/auth/me -> $status"
          test "$status" = 401
