# Production stack for the VPS: PostgreSQL and the backend. The backend listens on localhost only;
# the host's nginx (deploy/nginx-site.conf) serves it over HTTPS. Run from this folder:
# docker compose up -d --build
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: records
      POSTGRES_USER: records
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in deploy/.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U records -d records"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ../backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/records
      DB_USERNAME: records
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in deploy/.env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS in deploy/.env}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-5200}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
