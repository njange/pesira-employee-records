# nginx site for the API. Replace api.example.com (and 5200 if you changed BACKEND_PORT), copy to
# /etc/nginx/sites-available/pesira-api.conf, link it into sites-enabled, check with nginx -t and
# reload. Then `certbot --nginx -d api.example.com` adds HTTPS and the HTTP-to-HTTPS redirect.
server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    location / {
        proxy_pass http://127.0.0.1:5200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
