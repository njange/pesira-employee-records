spring:
  application:
    name: records
  config:
    # Reads the repository-root .env when started from backend/
    import: optional:file:../.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/records}
    username: ${DB_USERNAME:records}
    password: ${DB_PASSWORD:records}
  mvc:
    problemdetails:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

app:
  jwt:
    secret: ${JWT_SECRET}
    ttl: 60m
  cors:
    # Comma-separated; each entry may use * as a wildcard.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
